<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vu Kieu Phuong | Terminal Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      background: #0d1117;
      color: #c9d1d9;
    }

    .terminal {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .prompt {
      color: #58a6ff;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      background: #c9d1d9;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .output {
      margin-bottom: 10px;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div class="terminal" id="terminal">
    <div class="output">
Welcome to Vũ Kiều Phương's portfolio

Type 'help' to see available commands
    </div>
    <div>
      <span class="prompt">$</span>
      <span class="cursor"></span>
    </div>
  </div>

  <script>
    const terminal = document.getElementById("terminal");

    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        const input = prompt("Enter command:");
        if (!input) return;

        const cmd = input.trim().toLowerCase();

        let output = "";

        if (cmd === "help") {
          output = "Available commands:\\nabout\\nskills\\ncontact\\nclear";
        } else if (cmd === "about") {
          output = "Business Analyst / Project Assistant\\nLove tech & product";
        } else if (cmd === "skills") {
          output = "BA · SQL · Excel · Agile · Communication";
        } else if (cmd === "contact") {
          output = "Email: example@gmail.com\\nLinkedIn: linkedin.com";
        } else if (cmd === "clear") {
          terminal.innerHTML = "";
          return;
        } else {
          output = `Command not found: ${cmd}`;
        }

        const div = document.createElement("div");
        div.className = "output";
        div.textContent = output;
        terminal.insertBefore(div, terminal.lastElementChild);
      }
    });
  </script>
</body>
</html>
